spring:
  application:
    name: payledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/payledger}
    username: ${DB_USERNAME:payledger}
    password: ${DB_PASSWORD:payledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true        # Java 21 virtual threads for request handling

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
