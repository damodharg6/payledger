spring:
  application:
    name: payledger
  autoconfigure:
    exclude:
      # No default in-memory user with a generated password: auth is API keys (and JWT in Phase 6)
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/payledger}
    username: ${DB_USERNAME:payledger}
    password: ${DB_PASSWORD:payledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true        # Java 21 virtual threads for request handling

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

payledger:
  scheduling:
    enabled: true
  idempotency:
    stale-after: 5m          # a claimed key with no result after this long counts as abandoned
  payments:
    inquiry-after: 30s       # ask the bank again about payments unresolved for this long
    inquiry-interval: 15s    # how often the inquiry job runs
    inquiry-batch-size: 50
  reversals:
    interval: 30s            # how often the T+1 auto-reversal job runs
    initial-delay: 10s
    batch-size: 100          # most reversals per run; the next run continues
  bank:                      # mock bank / UPI switch (rates must add up to 1)
    success-rate: 0.85
    decline-rate: 0.07
    debited-failure-rate: 0.03   # "money debited, payment failed"
    timeout-rate: 0.05
    min-latency: 50ms
    max-latency: 300ms
    timeout: 2s              # PayLedger stops waiting after this and sends a status inquiry
    slow-response-delay: 3s  # how late a "timeout" charge answers
    inquiry-pending-rate: 0.10
