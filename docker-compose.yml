# PayLedger: the whole stack with one command. Author: Giddaluru Damodhar (MrDamodar), Agentic AI Engineer
#
#   docker compose up --build -d      # PostgreSQL + API + dashboard
#   open http://localhost:3000        # dashboard (Swagger UI: http://localhost:8080/swagger-ui.html)
#   docker compose up -d postgres     # only the database, when running the API from IntelliJ
#   docker compose down               # stop (add -v to also delete the data)
#
# The defaults below are for local use only. For anything shared, set JWT_SECRET (and a real
# database password) in your shell or in a .env file, which git ignores.

services:
  postgres:
    image: postgres:16
    container_name: payledger-postgres
    environment:
      POSTGRES_DB: payledger
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payledger}
    ports:
      - "15432:5432"   # host 15432: local Homebrew Postgres instances already use 5432-5434
    volumes:
      - payledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: payledger-api:local
    container_name: payledger-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payledger
      DB_USERNAME: payledger
      DB_PASSWORD: ${DB_PASSWORD:-payledger}
      JWT_SECRET: ${JWT_SECRET:-bG9jYWwtZGV2LW9ubHktcGF5bGVkZ2VyLWp3dC1zZWNyZXQtY2hhbmdlLW1l}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
    ports:
      - "8080:8080"
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    image: payledger-dashboard:local
    container_name: payledger-dashboard
    depends_on:
      app:
        condition: service_healthy
    environment:
      API_URL: http://app:8080
      PORT: "80"
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  payledger-data:
