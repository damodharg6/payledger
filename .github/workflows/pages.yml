# Publishes the website (web/) to GitHub Pages at https://damodharg6.github.io/payledger/
# Author: Giddaluru Damodhar (MrDamodar), Agentic AI Engineer
name: Website

# Pull requests only build (so a broken site never reaches main); pushes to main also deploy.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Build and pre-render under /payledger/
        run: npm run build
        env:
          BASE_PATH: /payledger/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
